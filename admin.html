<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef3ff;
            color: #333;
            min-height: 100vh;
        }

        /* Navigation Bar */

        nav {
            background: #243b80;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }


        /* Login Section */

        .login-section {
            text-align: center;
            padding: 70px 20px;
        }


        .login-section h1 {
            font-family: Algerian, serif;
            color: #243b80;
            font-size: 40px;
            margin-bottom: 10px;
        }

        .login-section p {
            color: #666;
            font-size: 17px;
            margin-bottom: 35px;
        }


        /* Login Card */

        .login-box {
            background: white;

            width: 380px;
            max-width: 90%;

            margin: auto;

            padding: 35px;

            border-radius: 18px;

            box-shadow: 0 8px 25px rgba(36, 59, 128, 0.18);

            border: 1px solid #ccd6f0;
        }


        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }


        /* Input Fields */

        input {
            width: 100%;

            padding: 13px;

            margin: 10px 0;

            border: 1px solid #b8c4df;

            border-radius: 8px;

            font-size: 15px;

            background: #f8faff;

            outline: none;
        }

        input:focus {
            border-color: #243b80;
            box-shadow: 0 0 5px rgba(36, 59, 128, 0.2);
        }


        /* Login Button */

        button {
            width: 100%;

            padding: 13px;

            margin-top: 20px;

            background: #243b80;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #172b63;
            transform: scale(1.03);
        }


        /* Footer */

        footer {
            text-align: center;
            color: #666;
            font-size: 14px;
            padding: 20px;
        }


        /* Mobile */

        @media (max-width: 700px) {

            nav {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 8px;
            }

            .login-section h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <nav>

        <div class="logo">
            🏠 Hostel Outpass
        </div>

        <div>

            <a href="home.html">Home</a>

            <a href="index.html">Apply</a>

            <a href="status.html">Status</a>

            <a href="admin.html">Admin</a>

        </div>

    </nav>


    <!-- Login Section -->

    <section class="login-section">

        <h1>ADMIN LOGIN</h1>

        <p>
            Login to manage hostel outpass requests.
        </p>


        <div class="login-box">

            <div class="icon">
                🔐
            </div>

            <input
                type="text"
                id="username"
                placeholder="Admin Username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button
                type="button"
                onclick="adminLogin()">

                Login

            </button>

        </div>

    </section>


    <footer>

        Hostel Outpass Management System © 2026

    </footer>


    <!-- JavaScript -->

    <script>

        function adminLogin() {

            let username =
                document.getElementById("username").value;

            let password =
                document.getElementById("password").value;


            if (username === "admin" && password === "1234") {

                alert("Login Successful!");

                window.location.href =
                    "admin-dashboard.html";

            }

            else {

                alert("Invalid Username or Password!");

            }

        }

    </script>


</body>

</html>
